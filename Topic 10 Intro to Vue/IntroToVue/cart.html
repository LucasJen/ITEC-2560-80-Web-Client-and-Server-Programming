<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Vue</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <style>
        th, td {
            width: 25%;
            text-align: center;
        }
    </style>
</head>
<body>
<div id="app">

    <table>
        <tr>
            <th>Item</th>
            <th>Unit Price</th>
            <th>Quantiy</th>
            <th>Total</th>
        </tr>
        <tr>
            <td>{{ name }}</td>
            <td>{{ unitPrice }}</td>
            <td><input type="number" v-model="quantity"></td>
            <td>{{ total }}</td>
        </tr>
    </table>
</div>

<script>

    const {createApp, ref, computed} = Vue

    createApp({
        setup() {
            
            const name = ref('Hat')
            const quantity = ref(1)
            const unitPrice = ref(4.99)

            const total = computed( function () {
                const totalPrice = quantity.value * unitPrice.value
                const formattedPrice = totalPrice.toFixed(2)
                return formattedPrice
            })

            return {
                name,
                quantity,
                unitPrice,
                total
                

            }
        }
    }).mount('#app') //mounts functions to the above div


</script>
</body>
</html>
